<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>모바일 상황실</title>
<style>
  :root { --bg:#0e0e10; --card:#1b1b1f; --card2:#222227; --line:#2e2e34; --txt:#eee; --dim:#9a9aa4;
          --green:#3fbf7f; --red:#e05a5a; --yellow:#d9b04a; --blue:#4a8fe0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif; }
  body { padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .wrap { max-width:520px; margin:0 auto; padding:14px 14px 40px; }
  header { display:flex; align-items:center; justify-content:space-between; padding:10px 2px 16px; }
  header h1 { font-size:17px; margin:0; font-weight:700; }
  header button { background:none; border:none; color:var(--dim); font-size:20px; padding:6px; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .tabs button { flex:1; padding:10px 0; border-radius:10px; border:1px solid var(--line); background:var(--card);
    color:var(--dim); font-size:14px; font-weight:600; }
  .tabs button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  section { display:none; } section.on { display:block; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .card h2 { font-size:13px; color:var(--dim); margin:0 0 10px; font-weight:600; letter-spacing:.02em; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:14px; }
  .row .k { color:var(--dim); }
  .pill { display:inline-block; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:600; }
  .pill.g { background:rgba(63,191,127,.18); color:var(--green); }
  .pill.r { background:rgba(224,90,90,.18); color:var(--red); }
  .pill.y { background:rgba(217,176,74,.18); color:var(--yellow); }
  .pill.b { background:rgba(74,143,224,.18); color:var(--blue); }
  .blocker { background:rgba(224,90,90,.12); border:1px solid rgba(224,90,90,.35); border-radius:10px;
    padding:10px; font-size:13px; margin-top:8px; color:#ffb4b4; }
  .log-item { border-top:1px solid var(--line); padding:9px 0; font-size:13px; }
  .log-item:first-child { border-top:none; }
  .log-item .meta { color:var(--dim); font-size:11px; margin-bottom:2px; }
  .holdbar { display:flex; align-items:center; justify-content:space-between; background:var(--card2);
    border-radius:12px; padding:12px 14px; margin-bottom:14px; }
  .holdbar .label { font-size:15px; font-weight:700; }
  .holdbar .sub { font-size:12px; color:var(--dim); margin-top:2px; }
  .switch { position:relative; width:52px; height:30px; flex:none; }
  .switch input { opacity:0; width:100%; height:100%; margin:0; position:absolute; z-index:2; cursor:pointer; }
  .switch .track { position:absolute; inset:0; background:#444; border-radius:999px; transition:.2s; }
  .switch .thumb { position:absolute; top:3px; left:3px; width:24px; height:24px; background:#fff; border-radius:50%; transition:.2s; }
  .switch input:checked + .track { background:var(--red); }
  .switch input:checked ~ .thumb { transform:translateX(22px); }
  .cut-item { display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-top:1px solid var(--line); padding:10px 0; }
  .cut-item:first-child { border-top:none; }
  .cut-item .info { font-size:13px; flex:1; }
  .cut-item .info .why { color:var(--dim); font-size:12px; margin-top:2px; }
  button.act { border:none; border-radius:10px; padding:10px 14px; font-size:13px; font-weight:700; color:#fff;
    background:var(--green); min-height:40px; }
  button.act:disabled { background:#3a3a40; color:#777; }
  textarea { width:100%; min-height:90px; border-radius:10px; border:1px solid var(--line); background:var(--card2);
    color:var(--txt); font-size:14px; padding:10px; font-family:inherit; resize:vertical; }
  .sendbtn { width:100%; margin-top:10px; border:none; border-radius:10px; padding:13px 0; font-size:15px;
    font-weight:700; color:#fff; background:var(--blue); min-height:44px; }
  .sendbtn:disabled { background:#3a3a40; color:#777; }
  .empty { color:var(--dim); font-size:13px; padding:8px 0; }
  .errbox { background:rgba(224,90,90,.12); border:1px solid rgba(224,90,90,.35); border-radius:10px;
    padding:12px; font-size:13px; color:#ffb4b4; margin-bottom:12px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1>🎬 모바일 상황실</h1>
    <button onclick="loadAll()">⟳</button>
  </header>
  <div class="tabs">
    <button class="on" data-tab="status" onclick="showTab('status')">상황</button>
    <button data-tab="decide" onclick="showTab('decide')">판단</button>
    <button data-tab="memo" onclick="showTab('memo')">메모</button>
  </div>
  <div id="err"></div>

  <section class="on" id="tab-status">
    <div class="card" id="statusCard"><h2>현재 에피소드</h2><div class="empty">불러오는 중...</div></div>
    <div class="card" id="pendingCard"><h2>사람 개입 대기</h2><div class="empty">불러오는 중...</div></div>
    <div class="card" id="logCard"><h2>최근 리더 로그</h2><div class="empty">불러오는 중...</div></div>
  </section>

  <section id="tab-decide">
    <div class="holdbar">
      <div><div class="label">⏸ 지금 전부 보류</div><div class="sub">켜면 리더가 이 에피소드를 건드리지 않음</div></div>
      <label class="switch"><input type="checkbox" id="holdSwitch" onchange="toggleHold(this.checked)">
        <span class="track"></span><span class="thumb"></span></label>
    </div>
    <div class="card" id="recommendCard"><h2>✅ 승인 대기 (자동검사 통과)</h2><div class="empty">불러오는 중...</div></div>
    <div class="card" id="blockedCard"><h2>⛔ 막힘 / 대상 없음 (읽기 전용)</h2><div class="empty">불러오는 중...</div></div>
  </section>

  <section id="tab-memo">
    <div class="card">
      <h2>메모 남기기</h2>
      <textarea id="memoText" placeholder="PC 복귀 전까지 기록해둘 내용..."></textarea>
      <button class="sendbtn" onclick="sendMemo()">리더 로그에 남기기</button>
    </div>
    <div class="card" id="memoLogCard"><h2>최근 남긴 메모</h2><div class="empty">불러오는 중...</div></div>
  </section>
</div>

<script>
const PIN = new URLSearchParams(location.search).get('pin') || sessionStorage.getItem('mobilePin') || ''
if (PIN) sessionStorage.setItem('mobilePin', PIN)

let EP = null // { episodeId, episodeCode }

function showTab(name) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name))
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === 'tab-' + name))
}

async function api(path, opts = {}) {
  const headers = Object.assign({ 'content-type': 'application/json' }, opts.headers || {})
  if (PIN) headers['x-mobile-pin'] = PIN
  const r = await fetch('/mobile' + path, Object.assign({}, opts, { headers }))
  const data = await r.json().catch(() => ({ ok: false, error: '응답 파싱 실패' }))
  if (!r.ok && data.ok !== true) throw new Error(data.error || `HTTP ${r.status}`)
  return data
}

function esc(s) { return String(s || '').replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c])) }
function ts(s) { return (s || '').slice(5, 16).replace('T', ' ') }

function setErr(msg) {
  document.getElementById('err').innerHTML = msg
    ? `<div class="errbox">⚠️ ${esc(msg)}<br>30~60초 후 새로고침(⟳)해서 다시 시도해주세요.</div>` : ''
}

async function loadAll() {
  setErr('')
  try {
    EP = await api('/active-episode')
    if (!EP.ok) { setErr(EP.error || '활성 에피소드 없음'); return }
    const [status, gate] = await Promise.all([
      api('/leader-status?episode=' + encodeURIComponent(EP.episodeCode)),
      api('/gate-eligibility?gate=G4'),
    ])
    renderStatus(status)
    renderDecide(gate, status)
  } catch (e) {
    setErr(e.message)
  }
}

function renderStatus(d) {
  const e = d.episode
  const card = document.getElementById('statusCard')
  if (e) {
    card.innerHTML = `<h2>현재 에피소드</h2>
      <div class="row"><span class="k">${esc(e.title || EP.episodeCode)}</span><span class="pill b">${esc(e.channel || '?')}</span></div>
      <div class="row"><span class="k">현재 게이트</span><span>${esc(e.currentGate || '?')}</span></div>
      <div class="row"><span class="k">에이전트 상태</span><span>${esc(e.agentState || '?')}</span></div>
      ${e.nextAction ? `<div class="row"><span class="k">다음 액션</span><span>${esc(e.nextAction)}</span></div>` : ''}
      ${e.hold ? `<div class="blocker">⏸ 보류됨 — 리더가 건드리지 않음</div>` : ''}
      ${e.blocker ? `<div class="blocker">⚠ ${esc(e.blocker)}</div>` : ''}`
    document.getElementById('holdSwitch').checked = !!e.hold
  } else {
    card.innerHTML = `<h2>현재 에피소드</h2><div class="empty">${esc(EP.episodeCode)} — 파이프라인 행 없음</div>`
  }

  const pend = document.getElementById('pendingCard')
  if (d.pendingHuman?.length) {
    pend.innerHTML = '<h2>사람 개입 대기</h2>' + d.pendingHuman.map(p =>
      `<div class="log-item"><div class="meta">${esc(p.episode)} · ${esc(p.stage)} · ${ts(p.at)}</div>${esc(p.summary)}</div>`
    ).join('')
  } else {
    pend.innerHTML = '<h2>사람 개입 대기</h2><div class="empty">없음</div>'
  }

  const log = document.getElementById('logCard')
  if (d.recentLog?.length) {
    log.innerHTML = '<h2>최근 리더 로그</h2>' + d.recentLog.slice(0, 10).map(r =>
      `<div class="log-item"><div class="meta">${ts(r.at)} · ${esc(r.stage)}/${esc(r.kind)}</div>${esc(r.summary)}${r.result ? ' → ' + esc(r.result) : ''}</div>`
    ).join('')
  } else {
    log.innerHTML = '<h2>최근 리더 로그</h2><div class="empty">없음</div>'
  }

  const memoLog = document.getElementById('memoLogCard')
  const memos = (d.recentLog || []).filter(r => r.kind === '사람선택')
  memoLog.innerHTML = '<h2>최근 남긴 메모</h2>' + (memos.length
    ? memos.map(r => `<div class="log-item"><div class="meta">${ts(r.at)}</div>${esc(r.summary)}</div>`).join('')
    : '<div class="empty">없음</div>')
}

function renderDecide(gate, status) {
  const cuts = gate.cuts || []
  const recommend = cuts.filter(c => c.verdict === 'recommend')
  const other = cuts.filter(c => c.verdict === 'blocked' || c.verdict === 'not_ready')

  const rc = document.getElementById('recommendCard')
  rc.innerHTML = '<h2>✅ 승인 대기 (자동검사 통과)</h2>' + (recommend.length
    ? recommend.map(c => `<div class="cut-item">
        <div class="info">CUT ${c.no} <span class="pill y">권고</span>
          <div class="why">${esc((c.reasons || []).join(' · ') || '자동검사 통과, 1클릭 승인 가능')}</div></div>
        <button class="act" onclick="approve(${c.no}, this)">승인</button>
      </div>`).join('')
    : '<div class="empty">지금 승인 대기 중인 컷 없음</div>')

  const bc = document.getElementById('blockedCard')
  bc.innerHTML = '<h2>⛔ 막힘 / 대상 없음 (읽기 전용)</h2>' + (other.length
    ? other.map(c => `<div class="cut-item"><div class="info">CUT ${c.no}
        <span class="pill r">${c.verdict === 'blocked' ? '막힘' : '대상없음'}</span>
        <div class="why">${esc((c.reasons || []).join(' · '))}</div></div></div>`).join('')
    : '<div class="empty">없음</div>')
}

async function approve(cutNo, btn) {
  if (!confirm(`CUT ${cutNo} G4 승인할까요?`)) return
  btn.disabled = true; btn.textContent = '...'
  try {
    await api('/studio-approve-g4', { method: 'POST', body: JSON.stringify({ episodeId: EP.episodeId, cutIds: [cutNo] }) })
    loadAll()
  } catch (e) { setErr(e.message); btn.disabled = false; btn.textContent = '승인' }
}

async function toggleHold(checked) {
  try {
    await api('/mobile-hold', { method: 'POST', body: JSON.stringify({ episodeId: EP.episodeId, hold: checked }) })
    loadAll()
  } catch (e) { setErr(e.message) }
}

async function sendMemo() {
  const el = document.getElementById('memoText')
  const text = el.value.trim()
  if (!text) return
  try {
    await api('/leader-log', { method: 'POST', body: JSON.stringify({
      episode: EP.episodeCode, stage: '사이클', kind: '사람선택', source: '사람',
      summary: text, humanInvolved: true,
    }) })
    el.value = ''
    loadAll()
  } catch (e) { setErr(e.message) }
}

loadAll()
</script>
</body>
</html>
