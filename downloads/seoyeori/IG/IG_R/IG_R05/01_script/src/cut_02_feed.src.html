<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- IG_R05 CUT2 — 친구들 피드(다크모드) 6초. MOTION:self, 절대시각 CSS 애니메이션. 이미지는 build_graphics.mjs 가 base64 로 인라인 -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#000;color:#f5f5f5;
    font-family:"Segoe UI","Malgun Gothic",sans-serif}
  .top{position:absolute;top:0;left:0;right:0;height:170px;padding:78px 44px 0;display:flex;align-items:center;
    justify-content:space-between;background:#000;z-index:5;border-bottom:1px solid #1c1c1c}
  .top .logo{font-size:52px;font-weight:600;letter-spacing:-1px;font-family:"Segoe Script","Segoe UI",cursive}
  .top .icons{display:flex;gap:44px}
  .ic{width:54px;height:54px;border:5px solid #f5f5f5;border-radius:16px}
  .ic.round{border-radius:50%}
  .feed{position:absolute;top:170px;left:0;width:1080px;animation:scroll 6s linear both}
  .post{height:1750px;position:relative}
  .head{height:120px;display:flex;align-items:center;padding:0 32px;gap:22px}
  .av{width:80px;height:80px;border-radius:50%;padding:5px;background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}
  .av i{display:block;width:100%;height:100%;border-radius:50%;border:4px solid #000;background-size:cover;background-position:center}
  .name{font-size:36px;font-weight:600}
  .loc{font-size:28px;color:#aaa;margin-top:2px}
  .dots{margin-left:auto;font-size:44px;color:#ddd;letter-spacing:4px}
  .photo{width:1080px;height:1350px;background-size:cover;background-position:center;position:relative;overflow:hidden}
  .big{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;opacity:0;transform:scale(0)}
  .actions{height:120px;display:flex;align-items:center;padding:0 34px;gap:40px;position:relative}
  .heart{width:66px;height:66px;position:relative}
  .heart svg{position:absolute;inset:0;width:100%;height:100%}
  .heart .on{opacity:0}
  .shape{width:60px;height:60px;border:5px solid #f5f5f5;border-radius:50%}
  .shape.sq{border-radius:10px;transform:skewX(-12deg)}
  .likes{font-size:34px;font-weight:600;padding:0 38px}
  .cap{font-size:34px;padding:10px 38px 0;line-height:1.45}
  .cap b{font-weight:600;margin-right:12px}
  .time{font-size:26px;color:#888;padding:12px 38px}
  .tap{position:absolute;left:34px;top:26px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.35);opacity:0;transform:scale(.3)}

  @keyframes scroll{0%,30%{transform:translateY(0)}36%,63%{transform:translateY(-1750px)}69%,100%{transform:translateY(-3500px)}}
  @keyframes on{0%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1.25)}70%,100%{opacity:1;transform:scale(1)}}
  @keyframes big{0%{opacity:0;transform:scale(0)}25%{opacity:.95;transform:scale(1.15)}45%{transform:scale(.95)}70%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
  @keyframes tap{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}
  @keyframes likes{0%,100%{opacity:1}}

  /* 게시물별 하트 탭 시각(절대초): 1 → 0.95s, 2 → 2.95s, 3 → 4.95s */
  #p1 .on{animation:on .45s ease-out .95s both}  #p1 .big{animation:big 1s ease-out .95s both}  #p1 .tap{animation:tap .5s ease-out .85s both}
  #p2 .on{animation:on .45s ease-out 2.95s both} #p2 .big{animation:big 1s ease-out 2.95s both} #p2 .tap{animation:tap .5s ease-out 2.85s both}
  #p3 .on{animation:on .45s ease-out 4.95s both} #p3 .big{animation:big 1s ease-out 4.95s both} #p3 .tap{animation:tap .5s ease-out 4.85s both}
  .n1{display:inline}.n2{display:none}
  @keyframes swapA{0%{visibility:visible}100%{visibility:hidden}}
  @keyframes swapB{0%{visibility:hidden}100%{visibility:visible}}
  #p1 .n1{animation:swapA 0s linear 1.05s both} #p1 .n2{display:inline;animation:swapB 0s linear 1.05s both}
  #p2 .n1{animation:swapA 0s linear 3.05s both} #p2 .n2{display:inline;animation:swapB 0s linear 3.05s both}
  #p3 .n1{animation:swapA 0s linear 5.05s both} #p3 .n2{display:inline;animation:swapB 0s linear 5.05s both}
  .n1,.n2{position:relative}
  .cnt{display:inline-grid}.cnt>span{grid-area:1/1}
</style></head>
<body>
<div class="top"><div class="logo">Instagram</div><div class="icons"><div class="ic round"></div><div class="ic"></div></div></div>

<div class="feed">
  <!-- 1. 지아 — 제주 -->

    <div class="photo" style="background-image:url('{{IMG:../02_images/feed/feed_jia.jpg}}')">
      <svg class="big" viewBox="0 0 24 24"><path fill="#fff" d="M12 21.4 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5L12 21.4z"/></svg>

        <svg class="on" viewBox="0 0 24 24"><path fill="#ff3040" d="M12 21.4 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5L12 21.4z"/></svg></div>
      <div class="shape"></div><div class="shape sq"></div></div>
    <div class="likes">좋아요 <span class="cnt"><span class="n1">128</span><span class="n2">129</span></span>개</div>

    </div>
    <div class="actions"><div class="tap"></div>
      <div class="heart"><svg viewBox="0 0 24 24"><path fill="none" stroke="#f5f5f5" stroke-width="2" d="M12 20.3 10.9 19.3C6 14.9 3 12.1 3 8.6 3 6 5 4 7.6 4c1.5 0 2.9.7 3.9 1.8L12 6.4l.5-.6C13.5 4.7 14.9 4 16.4 4 19 4 21 6 21 8.6c0 3.5-3 6.3-7.9 10.7z"/></svg>
        <svg class="on" viewBox="0 0 24 24"><path fill="#ff3040" d="M12 21.4 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5L12 21.4z"/></svg></div>
      <div class="shape"></div><div class="shape sq"></div></div>
    <div class="likes">좋아요 <span class="cnt"><span class="n1">86</span><span class="n2">87</span></span>개</div>
    <div class="cap"><b>jiyu.day</b>우리 또 모였다 🥂 금요일 최고</div>

  <!-- 3. 모르는 지인 — 커플링 -->
  <section class="post" id="p3">
    <div class="head"><div class="av"><i style="background:#3a3a3a"></i></div>
      <div><div class="name">hyun.and.soo</div><div class="loc"></div></div><div class="dots">···</div></div>
    <div class="photo" style="background-image:url('{{IMG:../02_images/feed/feed_ring.jpg}}')">
      <svg class="big" viewBox="0 0 24 24"><path fill="#fff" d="M12 21.4 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5L12 21.4z"/></svg>
    </div>
    <div class="actions"><div class="tap"></div>
      <div class="heart"><svg viewBox="0 0 24 24"><path fill="none" stroke="#f5f5f5" stroke-width="2" d="M12 20.3 10.9 19.3C6 14.9 3 12.1 3 8.6 3 6 5 4 7.6 4c1.5 0 2.9.7 3.9 1.8L12 6.4l.5-.6C13.5 4.7 14.9 4 16.4 4 19 4 21 6 21 8.6c0 3.5-3 6.3-7.9 10.7z"/></svg>
        <svg class="on" viewBox="0 0 24 24"><path fill="#ff3040" d="M12 21.4 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5L12 21.4z"/></svg></div>
      <div class="shape"></div><div class="shape sq"></div></div>
    <div class="likes">좋아요 <span class="cnt"><span class="n1">342</span><span class="n2">343</span></span>개</div>
    <div class="cap"><b>hyun.and.soo</b>1주년 💍 앞으로도 잘 부탁해</div>

</body></html>
