<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- IG_R05 CUT4 — 지아 DM(다크모드) 4초. 0~0.9s 알림 배너 → DM 화면, 타이핑 점 뒤 말풍선 3개. MOTION:self 절대시각 -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#000;color:#f5f5f5;font-family:"Segoe UI","Malgun Gothic",sans-serif}
  .av{border-radius:50%;background-size:cover;background-position:center}

  /* 알림 배너 (잠금화면 위) */
  .lock{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#1d2233 0%,#07080c 70%);animation:lockOut .25s ease-in .85s both}
  .clock{position:absolute;top:260px;width:100%;text-align:center;font-size:190px;font-weight:300;letter-spacing:-4px;color:#e9ecf5}
  .date{position:absolute;top:210px;width:100%;text-align:center;font-size:40px;color:#c8cce0}
  .banner{position:absolute;left:40px;right:40px;top:620px;height:190px;border-radius:44px;background:rgba(60,62,72,.92);
    display:flex;align-items:center;gap:30px;padding:0 36px;animation:bannerIn .45s cubic-bezier(.2,1.4,.4,1) .05s both, shake .3s ease-in-out .5s 1 both}
  .banner .av{width:110px;height:110px;flex:none}
  .banner .t1{font-size:36px;font-weight:600}
  .banner .t2{font-size:34px;color:#ddd;margin-top:6px}
  .banner .app{position:absolute;right:40px;top:36px;font-size:28px;color:#aaa}

  /* DM 화면 */
  .dm{position:absolute;inset:0;background:#000;animation:dmIn .3s ease-out .85s both}
  .bar{height:230px;padding:110px 40px 0;display:flex;align-items:center;gap:28px;border-bottom:1px solid #222}
  .back{width:34px;height:34px;border-left:6px solid #f5f5f5;border-bottom:6px solid #f5f5f5;transform:rotate(45deg);margin-right:10px}
  .bar .av{width:96px;height:96px}
  .bar .n{font-size:40px;font-weight:600}
  .bar .s{font-size:28px;color:#9a9a9a;margin-top:4px}
  .msgs{position:absolute;left:0;right:0;top:300px;padding:0 40px;display:flex;flex-direction:column;gap:22px}
  .row{display:flex;align-items:flex-end;gap:20px}
  .row .av{width:70px;height:70px;flex:none}
  .row .ghost{width:70px;flex:none}
  .b{background:#262626;border-radius:44px;padding:28px 38px;font-size:44px;line-height:1.4;max-width:780px}
  .sys{text-align:center;font-size:28px;color:#8a8a8a;margin:10px 0 20px}
  .typing{background:#262626;border-radius:44px;padding:34px 38px;display:flex;gap:14px}
  .typing i{width:18px;height:18px;border-radius:50%;background:#9a9a9a;animation:dot .9s ease-in-out infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  .cell{display:grid}.cell>*{grid-area:1/1;align-self:end}
  .row{opacity:0}
  /* 행 k: 타이핑 창 [ts, tm) → tm 에 말풍선 pop. 행 자체는 ts 에 나타남 */
  .r1{animation:vis 0s .95s both}.r2{animation:vis 0s 1.45s both}.r3{animation:vis 0s 2.2s both}
  .r1 .typing{animation:vis 0s .95s both, gone 0s 1.35s both}.r1 .b{animation:pop .28s cubic-bezier(.2,1.5,.4,1) 1.35s both}
  .r2 .typing{animation:vis 0s 1.45s both, gone 0s 2.05s both}.r2 .b{animation:pop .28s cubic-bezier(.2,1.5,.4,1) 2.05s both}
  .r3 .typing{animation:vis 0s 2.2s both, gone 0s 2.65s both}.r3 .b{animation:pop .28s cubic-bezier(.2,1.5,.4,1) 2.65s both}
  .typing{align-self:start !important;justify-self:start}
  .input{position:absolute;left:30px;right:30px;bottom:70px;height:120px;border-radius:60px;background:#262626;
    display:flex;align-items:center;padding:0 44px;font-size:38px;color:#8a8a8a}

  @keyframes bannerIn{0%{transform:translateY(-420px);opacity:0}100%{transform:translateY(0);opacity:1}}
  @keyframes shake{0%,100%{margin-left:0}25%{margin-left:-12px}75%{margin-left:12px}}
  @keyframes lockOut{0%{opacity:1}100%{opacity:0}}
  @keyframes dmIn{0%{opacity:0;transform:translateY(60px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes pop{0%{opacity:0;transform:scale(.6) translateY(20px);transform-origin:left bottom}100%{opacity:1;transform:scale(1)}}
  @keyframes dot{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-8px)}}
  /* 타이핑 점: 4초 타임라인 중 해당 창에서만 보이고, 말풍선이 뜨면 자리에서 빠진다(height 0) */
  @keyframes vis{0%{opacity:0}100%{opacity:1}}
  @keyframes gone{0%{opacity:1}100%{opacity:0}}
</style></head>
<body>
<div class="dm">
  <div class="bar"><div class="back"></div><div class="av" style="background-image:url('{{IMG:../../../../../flow/character/jia-face.jpg}}')"></div>
    <div><div class="n">jia.han</div><div class="s">지금 활동 중</div></div></div>
  <div class="msgs">
    <div class="sys">오후 11:07</div>
    <div class="row r1"><div class="av" style="background-image:url('{{IMG:../../../../../flow/character/jia-face.jpg}}')"></div><div class="cell"><div class="typing"><i></i><i></i><i></i></div><div class="b">뭐해?</div></div></div>
    <div class="row r2"><div class="ghost"></div><div class="cell"><div class="typing"><i></i><i></i><i></i></div><div class="b">나 여행 와서 사진만 찍고<br>지금 숙소에서 컵라면 먹는 중ㅋㅋ</div></div></div>
    <div class="row r3"><div class="ghost"></div><div class="cell"><div class="typing"><i></i><i></i><i></i></div><div class="b">집 가고 싶다 🥲</div></div></div>
  </div>
  <div class="input">메시지 보내기...</div>
</div>

<div class="lock">
  <div class="date">9월 26일 금요일</div>
  <div class="clock">11:07</div>
  <div class="banner"><div class="av" style="background-image:url('{{IMG:../../../../../flow/character/jia-face.jpg}}')"></div>
    <div><div class="t1">jia.han</div><div class="t2">뭐해?</div></div><div class="app">지금</div></div>
</div>
</body></html>
