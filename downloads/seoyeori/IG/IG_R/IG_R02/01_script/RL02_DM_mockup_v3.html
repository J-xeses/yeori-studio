<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RL02 DM 목업 v3</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

  body {
    background: #0a0a0a;
    display: flex;
    gap: 48px;
    justify-content: center;
    align-items: center;
    padding: 48px 40px;
    font-family: -apple-system, 'Noto Sans KR', 'Helvetica Neue', sans-serif;
    min-height: 100vh;
  }

  /* 1080x1920 캡처 기준 — 스마트폰 목업 높이가 화면 높이(1920px)의 70% 이상이
     되도록 전체를 균일 확대(내부 비율이 깨지지 않게 transform: scale 사용).
     기존 .phone 높이(약 660px, 패딩 포함) * 2.2 ≈ 1450px ≈ 화면의 76%. */
  .phone-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    transform: scale(2.2);
    transform-origin: center;
  }

  .label {
    color: #555;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .phone {
    width: 310px;
    background: #1a1a1a;
    border-radius: 50px;
    padding: 10px;
    box-shadow:
      0 0 0 1px #2a2a2a,
      0 0 0 8px #111,
      0 0 0 9px #2a2a2a,
      0 40px 100px rgba(0,0,0,0.9);
  }

  .screen {
    background: #000;
    border-radius: 42px;
    overflow: hidden;
    height: 640px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .dynamic-island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 34px;
    background: #000;
    border-radius: 20px;
    z-index: 10;
    box-shadow: 0 0 0 1px #1a1a1a;
  }

  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 16px 26px 8px;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    min-height: 52px;
    position: relative;
    z-index: 5;
  }

  .statusbar-right {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .battery-body {
    width: 22px;
    height: 11px;
    border: 1.5px solid #fff;
    border-radius: 3px;
    position: relative;
    display: flex;
    align-items: center;
    padding: 1.5px;
  }
  .battery-body::after {
    content: '';
    position: absolute;
    right: -5px;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 5px;
    background: #fff;
    border-radius: 0 1px 1px 0;
  }
  .battery-fill { width: 75%; height: 100%; background: #fff; border-radius: 1px; }

  .signal { display: flex; gap: 2px; align-items: flex-end; height: 11px; }
  .signal span { width: 3px; background: #fff; border-radius: 1px; display: block; }

  .dm-header {
    display: flex;
    align-items: center;
    padding: 8px 14px 10px;
    border-bottom: 0.5px solid #1c1c1c;
    gap: 10px;
    background: #000;
  }

  .back-btn {
    color: #fff;
    font-size: 26px;
    line-height: 1;
    font-weight: 300;
    margin-right: -2px;
    opacity: 0.9;
  }

  .profile-ring {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f9ce34, #ee2a7b, #6228d7);
    padding: 2px;
    flex-shrink: 0;
  }

  .profile-pic {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #1a1a1a;
    border: 2px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* JS 이니셜 디자인 */
  .initial-js {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
  }
  .initial-js::before {
    content: '';
    position: absolute;
    top: -8px; right: -8px;
    width: 28px; height: 28px;
    background: rgba(52, 152, 219, 0.3);
    border-radius: 50%;
  }
  .initial-js span {
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: -0.5px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    position: relative;
    z-index: 1;
  }
  .initial-js .accent {
    color: #3498db;
  }

  .profile-info { flex: 1; min-width: 0; }
  .profile-name { color: #fff; font-size: 14px; font-weight: 600; line-height: 1.3; letter-spacing: -0.2px; }
  .profile-sub { color: #888; font-size: 11px; margin-top: 1px; }

  .header-icons { display: flex; gap: 18px; color: #fff; }
  .header-icons svg { width: 22px; height: 22px; fill: #fff; }

  .messages {
    flex: 1;
    padding: 16px 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow: hidden;
    background: #000;
  }

  .date-divider { text-align: center; color: #555; font-size: 11px; margin: 6px 0 10px; font-weight: 500; }

  .bubble-received {
    display: flex;
    align-items: flex-end;
    gap: 7px;
    align-self: flex-start;
    max-width: 82%;
  }

  .bubble-avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bubble-text {
    background: #262626;
    color: #fff;
    padding: 9px 14px;
    border-radius: 22px 22px 22px 6px;
    font-size: 14px;
    line-height: 1.55;
    word-break: keep-all;
    letter-spacing: -0.1px;
  }

  .bubble-cont { margin-top: 2px; }

  .seen-text {
    color: #555;
    font-size: 10.5px;
    align-self: flex-end;
    margin-top: 1px;
    margin-right: 2px;
    font-weight: 500;
  }

  .reaction-wrap { display: flex; align-items: center; gap: 6px; margin-left: 33px; margin-top: 2px; }
  .reaction {
    background: #1c1c1c;
    border: 1px solid #2a2a2a;
    border-radius: 20px;
    padding: 3px 8px;
    font-size: 12px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .reaction-count { color: #888; font-size: 11px; }

  .input-area {
    display: flex;
    align-items: center;
    padding: 8px 12px 22px;
    gap: 10px;
    background: #000;
    border-top: 0.5px solid #1a1a1a;
  }
  .input-left { display: flex; gap: 12px; color: #fff; font-size: 22px; }
  .input-box {
    flex: 1;
    background: transparent;
    border: 1.5px solid #2a2a2a;
    border-radius: 22px;
    padding: 9px 16px;
    color: #555;
    font-size: 14px;
  }
  .input-right { color: #3797f0; font-size: 14px; font-weight: 600; white-space: nowrap; }
</style>
</head>
<body>

<!-- CUT 2 — 협찬 문의 DM (brand_jisu / JS 이니셜) -->
<div class="phone-wrap">
  <div class="label">CUT 2 — 협찬 문의</div>
  <div class="phone">

      <div class="statusbar">

      </div>

      <div class="dm-header">
        <span class="back-btn">‹</span>
        <div class="profile-ring">
          <div class="profile-pic">
            <!-- JS 이니셜 디자인 -->
            <div class="initial-js">
              <span><span class="accent">J</span>S</span>

          </div>
        </div>
        <div class="profile-info">
          <div class="profile-name">brand_jisu</div>
          <div class="profile-sub">활성 2시간 전</div>
        </div>
        <div class="header-icons">
          <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M15 8v8H5V8h10m1-2H4c-.6 0-1 .4-1 1v10c0 .6.4 1 1 1h12c.6 0 1-.4 1-1v-3.5l4 4v-11l-4 4V7c0-.6-.4-1-1-1z"/></svg>
        </div>
      </div>

      <div class="messages">
        <div class="date-divider">오늘</div>

        <div class="bubble-received">
          <div class="bubble-avatar">
            <div class="initial-js" style="width:26px;height:26px;font-size:10px;">
              <span><span class="accent">J</span>S</span>
            </div>
          </div>
          <div class="bubble-text">안녕하세요, 혹시<br>협찬 가능하신가요?</div>
        </div>

        <div class="bubble-received bubble-cont">
          <div class="bubble-avatar" style="visibility:hidden;"></div>
          <div class="bubble-text">팔로워 수 대비<br>인게이지먼트가<br>높으셔서요 😊</div>
        </div>

        <div class="seen-text">읽음</div>
      </div>

      <div class="input-area">
        <div class="input-left"><span>📷</span><span>🎤</span><span>🖼️</span><span>♥</span></div>
        <div class="input-box">메시지...</div>
        <div class="input-right">보내기</div>
      </div>
    </div>
  </div>
</div>

</body>
