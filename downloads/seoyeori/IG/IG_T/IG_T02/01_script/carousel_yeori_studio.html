<!doctype html>
<!--
  IG_T02 티저② — 연속 캐러셀 "Yeori Studio / 여리 스튜디오"  v2 (2026-09-24)
  - 성준님 구성: 4장, 2행 2열. 캔버스 2160×2700 을 2×2 로 잘라 슬라이드 1~4(각 1080×1350, 4:5).
    넘기는 순서 = 왼위 → 오위 → 왼아래 → 오아래.
  - v2(성준님 피드백): 눌린 홈·골드 제거, 전체 모음 5번 제거.
    "Studio" 의 o 와 "여" 의 ㅇ 은 글자가 아닌 **도형 동그라미** — 선 굵기는 실제 글자 획 굵기를 재서 맞춤.
    굴러간 흔적도 같은 동그라미를 흰색 계열로 흐리게 → 본체와 모양이 이어짐(2 끝에서 반쯤 나가 3 으로 반쯤 들어와 ㅇ 자리로).
  - 부조: 글자는 text-shadow, 동그라미·'여'(ㅇ 뺀 그림)는 같은 값의 drop-shadow 로 질감 통일.
  - '여' 는 캔버스에 그린 뒤 ㅇ 덩어리만 지운 이미지(ㅕ 가로획이 ㅇ 에 붙어 있어 단순 clip 으로는 획이 잘림).
-->
<html lang="ko"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500&family=IBM+Plex+Sans+KR:wght@500&display=block" rel="stylesheet">
<style>
  :root {
    --paper: #f2efe9;
    --ts: -3px -3px 3px rgba(255,255,255,.95), 6px 7px 10px rgba(70,58,40,.30), 1px 1px 1px rgba(70,58,40,.22);
    --ds: drop-shadow(-3px -3px 2px rgba(255,255,255,.95)) drop-shadow(6px 7px 6px rgba(70,58,40,.30)) drop-shadow(1px 1px 0.5px rgba(70,58,40,.22));
    --ds-faint: drop-shadow(-2px -2px 2px rgba(255,255,255,.8)) drop-shadow(4px 5px 5px rgba(70,58,40,.14));
  }
  html, body { margin: 0; width: 2160px; height: 2700px; overflow: hidden; background: var(--paper); }
  .paper { position: absolute; inset: 0;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .40 0 0 0 0 .33 0 0 0 .07 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),
                radial-gradient(ellipse at 50% 50%, #f8f6f2 0%, #efebe4 65%, #e6e1d8 100%); }
  .lamp { position: absolute; width: 1080px; height: 1350px; background: radial-gradient(ellipse at 50% 48%, rgba(255,255,255,.35), rgba(255,255,255,0) 60%); }
  .t { position: absolute; font-weight: 500; color: var(--paper); text-shadow: var(--ts); line-height: 1; white-space: nowrap; }
  .en { font-family: 'IBM Plex Sans', sans-serif; font-size: 280px; letter-spacing: .02em; }
  .ko { font-family: 'IBM Plex Sans KR', sans-serif; font-size: 300px; letter-spacing: .06em; }
  .ko.sm { font-size: 250px; }
  .hole { color: transparent !important; text-shadow: none !important; }   /* 자리만 차지(동그라미로 대체될 글자) */
  i.bl { display: inline-block; width: 0; height: 0; vertical-align: baseline; }
  .ring { position: absolute; border-radius: 50%; box-sizing: border-box; border-style: solid; border-color: var(--paper); filter: var(--ds); }
  .ring.trail { filter: var(--ds-faint); }
  #yeoImg { position: absolute; filter: var(--ds); }
</style></head><body>
<div class="paper"></div>
<div class="lamp" style="left:0;top:0"></div><div class="lamp" style="left:1080px;top:0"></div>
<div class="lamp" style="left:0;top:1350px"></div><div class="lamp" style="left:1080px;top:1350px"></div>

<div class="t en" id="w1">Yeori</div>
<div class="t en" id="w2">Studi<span class="hole" id="oHole">o<i class="bl" id="blO"></i></span></div>
<div class="t ko" id="w3"><span class="hole" id="yeo">여<i class="bl" id="blY"></i></span>리</div>
<div class="t ko sm" id="w4">스튜디오</div>
<img id="yeoImg" alt="">
<div id="rings"></div>
<script>
  const place = (el, cx, cy) => { const r = el.getBoundingClientRect(); el.style.left = (cx - r.width / 2) + 'px'; el.style.top = (cy - r.height / 2) + 'px' }
  // 글자를 캔버스에 그려 잉크 정보를 얻는다. part='first' = 가장 왼쪽 덩어리(flood fill) = '여'의 ㅇ.
  function glyph(ch, font, px) {
    const W = Math.ceil(px * 2.2), H = Math.ceil(px * 2.2), B = Math.round(px * 1.5)
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H
    const x = cv.getContext('2d', { willReadFrequently: true }); x.font = font; x.fillStyle = '#000'; x.fillText(ch, 0, B)
    return { cv, x, W, H, B, d: x.getImageData(0, 0, W, H) }
  }
  function component(g, first) {   // first=true: 첫 덩어리 픽셀 집합 + bbox, false: 전체 bbox
    const { W, H, d } = g, on = (i, j) => i >= 0 && j >= 0 && i < W && j < H && d.data[(j * W + i) * 4 + 3] > 40
    let x0 = W, x1 = -1, y0 = H, y1 = -1; const grow = (i, j) => { if (i < x0) x0 = i; if (i > x1) x1 = i; if (j < y0) y0 = j; if (j > y1) y1 = j }
    const seen = new Uint8Array(W * H)
    if (first) { let si = -1, sj = -1
      for (let i = 0; i < W && si < 0; i++) for (let j = 0; j < H; j++) if (on(i, j)) { si = i; sj = j; break }
      const st = [[si, sj]]; seen[sj * W + si] = 1
      while (st.length) { const [i, j] = st.pop(); grow(i, j)
        for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) { const ni = i + a, nj = j + b; if (on(ni, nj) && !seen[nj * W + ni]) { seen[nj * W + ni] = 1; st.push([ni, nj]) } } }
    } else for (let i = 0; i < W; i++) for (let j = 0; j < H; j++) if (on(i, j)) { grow(i, j); seen[j * W + i] = 1 }
    // 획 굵기 = 가운데 가로줄에서 왼쪽 첫 잉크 구간 길이
    const mid = Math.round((y0 + y1) / 2); let s0 = -1, s1 = -1
    for (let i = x0; i <= x1; i++) { const o = seen[mid * W + i]; if (o && s0 < 0) s0 = i; if (!o && s0 >= 0) { s1 = i; break } }
    return { seen, l: x0, r: x1 + 1, t: y0 - g.B, b: y1 + 1 - g.B, w: x1 - x0 + 1, h: y1 - y0 + 1, stroke: s1 - s0 }
  }
  const baseY = el => el.getBoundingClientRect().top   // 0 크기 표식 = 베이스라인
  const ring = (cx, cy, w, h, stroke, cls, op) => `<div class="ring ${cls || ''}" style="left:${cx - w / 2}px;top:${cy - h / 2}px;width:${w}px;height:${h}px;border-width:${stroke}px;opacity:${op ?? 1}"></div>`

  document.fonts.ready.then(() => {
    place(w1, 540, 640); place(w2, 1620, 640); place(w3, 540, 1990); place(w4, 1620, 1990)
    // ── "Studio" 의 o → 도형 ──
    const sO = getComputedStyle(oHole), pxO = parseFloat(sO.fontSize)
    const gO = glyph('o', `${sO.fontWeight} ${sO.fontSize} ${sO.fontFamily}`, pxO), cO = component(gO, false)
    const oLeft = oHole.getBoundingClientRect().left, oBase = baseY(blO)
    const oCx = oLeft + (cO.l + cO.r) / 2, oCy = oBase + (cO.t + cO.b) / 2
    // ── '여' → ㅇ 뺀 그림 + ㅇ 도형 ──
    const sY = getComputedStyle(yeo), pxY = parseFloat(sY.fontSize), fontY = `${sY.fontWeight} ${sY.fontSize} ${sY.fontFamily}`
    const gY = glyph('여', fontY, pxY), cI = component(gY, true)
    // ㅇ 픽셀(+1px 번짐 여유) 지우고, 남은 ㅕ 를 종이색으로 칠한 이미지
    const img = gY.x.getImageData(0, 0, gY.W, gY.H)
    for (let j = 0; j < gY.H; j++) for (let i = 0; i < gY.W; i++) {
      const k = (j * gY.W + i) * 4
      let near = cI.seen[j * gY.W + i]
      if (!near) for (let a = -1; a <= 1 && !near; a++) for (let b = -1; b <= 1 && !near; b++) { const ni = i + a, nj = j + b; if (ni >= 0 && nj >= 0 && ni < gY.W && nj < gY.H && cI.seen[nj * gY.W + ni]) near = 1 }
      if (near) img.data[k + 3] = 0
      else { img.data[k] = 0xf2; img.data[k + 1] = 0xef; img.data[k + 2] = 0xe9 }
    }
    gY.x.putImageData(img, 0, 0)
    const yLeft = yeo.getBoundingClientRect().left, yBase = baseY(blY)
    yeoImg.src = gY.cv.toDataURL()
    yeoImg.style.left = yLeft + 'px'; yeoImg.style.top = (yBase - gY.B) + 'px'
    const iCx = yLeft + (cI.l + cI.r) / 2, iCy = yBase + (cI.t + cI.b) / 2
    // ── 동그라미들: 본체 2개 + 굴러간 흔적(흰색 계열로 흐리게) ──
    const oW = cO.w, oH = cO.h, oS = cO.stroke, iW = cI.w, iH = cI.h, iS = cI.stroke
    const lerp = (a, b, t) => a + (b - a) * t
    const trail = [   // 2 오른쪽 끝(반쯤 나감) → 3 왼쪽 끝(반쯤 들어옴) → ㅇ 자리로
      // 경계의 두 반쪽은 높이(슬라이드 안 y)·크기·흐림을 똑같이 → 넘길 때 하나의 동그라미로 이어짐
      { x: 2160, y: oCy, t: 0.25, op: .5 },
      { x: 0, y: oCy + 1350, t: 0.25, op: .5 },
      { x: iCx * 0.5, y: lerp(oCy + 1350, iCy, .6), t: .6, op: .72 },
    ].map(p => ring(p.x, p.y, lerp(oW, iW, p.t), lerp(oH, iH, p.t), lerp(oS, iS, p.t), 'trail', p.op))
    rings.innerHTML = ring(oCx, oCy, oW, oH, oS) + trail.join('') + ring(iCx, iCy, iW, iH, iS)
    document.body.dataset.ready = '1'
  })
</script>
</body></html>
