<!doctype html>
<!--
  IG_T01 티저 — "Se ye ri → Seoyeori → 서여리" (1080×1920, 6.5s)
  - 애니메이션은 전부 CSS @keyframes(딜레이 절대시각) → 메이킹 파이프라인 MOTION:self 프레임 캡처와 호환
    (document.getAnimations() 의 currentTime 을 프레임마다 지정해 스크럽).
  - JS 는 로드 시 1회: ?v= 변형 적용 + ㅇ 동전이 '여' 로 날아갈 좌표 계산(CSS 변수). 타이밍엔 관여 안 함.
  - 변형(v): black(기본) · navy · wine · gold · ink · dark · glow
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>IG_T01 Seoyeori Teaser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+KR:wght@300;400;500&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #111111;
    --coin: #111111;          /* 동전 o 색 */
    --hangul: #111111;
    --size: 200px;
    --blur0: 16px;
  }
  /* ── 변형 ─────────────────────────────────────────── */
  body.v-navy  { --ink: #1b2a4a; --coin: #1b2a4a; --hangul: #1b2a4a; }
  body.v-wine  { --ink: #5a1a24; --coin: #5a1a24; --hangul: #5a1a24; }
  body.v-gold  { --ink: #111111; --coin: #b8892b; --hangul: #111111; }
  body.v-ink   { --ink: #111111; --coin: #111111; --hangul: #111111; --blur0: 28px; }
  body.v-dark  { --bg: #0e0e10; --ink: #f4f1ea; --coin: #f4f1ea; --hangul: #f4f1ea; }
  body.v-glow  { --bg: #0e0e10; --ink: #f4f1ea; --coin: #e9c46a; --hangul: #f4f1ea; }
  body.v-glow .face, body.v-glow .word, body.v-glow .hangul { text-shadow: 0 0 18px rgba(233,196,106,.45); }
  body.v-gold .face { background: linear-gradient(135deg,#8a6420 0%,#e8c46a 45%,#fff3c4 52%,#b8892b 70%,#7a5518 100%);
                      -webkit-background-clip: text; background-clip: text; color: transparent; }
  body.v-ink .word { filter: url(#bleed); }

  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

  /* ── 영문 ─────────────────────────────────────────── */
  .word {
    font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: var(--size);
    color: var(--ink); letter-spacing: .01em; line-height: 1; display: flex; align-items: baseline;
    animation: wordIn 1.4s cubic-bezier(.2,.7,.2,1) 0s both,
               settle .45s cubic-bezier(.3,1.6,.5,1) 3.1s both;
  }
  .word .l { display: inline-block; animation: lettersOut .7s ease-in 3.9s both; }
  @keyframes wordIn  { from { opacity: .18; filter: blur(var(--blur0)); letter-spacing: .09em; }
                       to   { opacity: 1;   filter: blur(0);            letter-spacing: .01em; } }
  @keyframes settle  { 0% { transform: scale(1); } 40% { transform: scale(1.035); } 100% { transform: scale(1); } }
  @keyframes lettersOut { to { opacity: 0; filter: blur(14px); } }

  /* ── 동전 o ───────────────────────────────────────── */
  /* ghost = 보이지 않는 o(폭·베이스라인 확보) → 코인 면들이 같은 줄 위치에 겹쳐 그려짐 */
  .slot { position: relative; display: inline-block; perspective: 900px; }
  .ghost { visibility: hidden; }
  .coin { position: absolute; inset: 0; transform-style: preserve-3d; }
  .face { position: absolute; left: 0; top: 0; width: 100%; text-align: center; color: var(--coin);
          backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face.back { transform: rotateY(180deg); }
  .face.hg { font-family: 'Noto Serif KR', serif; font-weight: 500; font-size: 1em; top: .14em; line-height: 1; color: var(--hangul); }

  /* 슬롯: 위에서 떨어짐(+ 이후 퇴장/이동) · 코인: 3바퀴 회전(rotate) + 마지막 반바퀴(transform) */
  .c1 { animation: drop .45s cubic-bezier(.3,0,.6,1) 1.4s both, fadeBlur .7s ease-in 3.9s both; }
  .c2 { animation: drop .45s cubic-bezier(.3,0,.6,1) 1.6s both, toYeo .8s cubic-bezier(.5,0,.2,1) 4.35s forwards; }
  .c1 .coin { animation: spin 1.5s cubic-bezier(.15,.6,.25,1) 1.4s both; }
  .c2 .coin { animation: spin 1.5s cubic-bezier(.15,.6,.25,1) 1.6s both,
                         flipHangul .55s cubic-bezier(.4,0,.2,1) 3.9s both; }
  @keyframes drop { from { opacity: 0; translate: 0 -1.1em; } 60% { opacity: 1; } to { opacity: 1; translate: 0 0; } }
  @keyframes spin { from { rotate: y 0deg; } to { rotate: y 1080deg; } }
  @keyframes flipHangul { from { transform: rotateY(0deg); } to { transform: rotateY(180deg); } }
  @keyframes fadeBlur { to { opacity: 0; filter: blur(14px); } }
  /* 첫 회전 중엔 뒷면도 o, 마지막 뒤집기 직전에 ㅇ 으로 교체(한 번에 전환) */
  .c2 .back.o  { animation: hide 1ms linear 3.95s both; }
  .c2 .back.hg { animation: show 1ms linear 3.95s both; }
  @keyframes hide { from { opacity: 1; } to { opacity: 0; } }
  @keyframes show { from { opacity: 0; } to { opacity: 1; } }
  /* ㅇ 이 '여' 의 ㅇ 자리로 이동·축소하며 한글 속으로 녹아듦 */
  @keyframes toYeo { 0% { transform: translate(0,0) scale(1); opacity: 1; }
                     75% { opacity: 1; }
                     100% { transform: translate(var(--dx,0px), var(--dy,0px)) scale(var(--ds,.86)); opacity: 0; } }

  /* ── 한글 ─────────────────────────────────────────── */
  .hangul {
    position: absolute; font-family: 'Noto Serif KR', serif; font-weight: 400; font-size: 190px;
    color: var(--hangul); letter-spacing: .06em; line-height: 1;
    animation: hangulIn 1.1s cubic-bezier(.2,.7,.2,1) 4.6s both;
  }
  @keyframes hangulIn { from { opacity: 0; filter: blur(18px); letter-spacing: .14em; }
                        to   { opacity: 1; filter: blur(0);    letter-spacing: .06em; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="bleed"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
</svg>
<div class="stage">
  <div class="word" id="word">
    <span class="l">S</span><span class="l">e</span>
    <span class="slot c1"><span class="ghost">o</span><span class="coin"><span class="face">o</span><span class="face back">o</span></span></span>
    <span class="l">y</span><span class="l">e</span>
    <span class="slot c2" id="c2"><span class="ghost">o</span><span class="coin"><span class="face">o</span><span class="face back o">o</span><span class="face back hg" id="hg">ㅇ</span></span></span>
    <span class="l">r</span><span class="l">i</span>
  </div>
  <div class="hangul" id="hangul">서<span id="yeo">여</span>리</div>
</div>
<script>
  // 변형 선택: ?v=gold 등
  const v = new URLSearchParams(location.search).get('v')
  if (v) document.body.classList.add('v-' + v)
  // ㅇ 동전 → '여' 의 ㅇ 자리 좌표(CSS 변수). 애니메이션 도중 값으로 재면 틀리므로
  // 잠깐 멈춰서 "이동 시작 시점"(4.35s)의 동전 위치와 "완성 시점"(6.0s)의 '여' 위치를 따로 잰다.
  function place() {
    const anims = document.getAnimations()
    const at = (ms) => anims.forEach(a => { try { a.pause(); a.currentTime = ms } catch (e) {} })
    const c = document.getElementById('c2'), g = document.getElementById('hg'), y = document.getElementById('yeo')
    at(4450); const gr = g.getBoundingClientRect()          // 뒤집기 완료 직후 ㅇ 글자 위치
    at(6000); const yr = y.getBoundingClientRect()
    const tx = yr.left + yr.width * 0.235, ty = yr.top + yr.height * 0.52   // '여' 안 ㅇ 중심(대략)
    c.style.setProperty('--dx', (tx - (gr.left + gr.width / 2)) + 'px')
    c.style.setProperty('--dy', (ty - (gr.top + gr.height / 2)) + 'px')
    at(0); anims.forEach(a => { try { a.play() } catch (e) {} })
  }
  document.fonts.ready.then(place)
</script>
</body>
</html>
