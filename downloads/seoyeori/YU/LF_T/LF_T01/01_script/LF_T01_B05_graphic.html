<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B-05 | HYBE 전략 도식</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --black:  #060608;
    --ls:     #5BB8FF;
    --il:     #FF6B8A;
    --kat:    #C87FFF;
    --hybe:   #FFD97A;
    --white:  #F2F0FF;
    --glow-ls:   rgba(91,184,255,0.6);
    --glow-il:   rgba(255,107,138,0.6);
    --glow-kat:  rgba(200,127,255,0.6);
    --glow-hybe: rgba(255,217,122,0.6);
  }

  html, body {
    width:1920px; height:1080px;
    overflow:hidden;
    background:var(--black);
    font-family:'Noto Sans KR', sans-serif;
  }

  canvas#bg { position:fixed; inset:0; pointer-events:none; }

  .bg-pulse {
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 45% 70% at 50% 50%, rgba(255,217,122,0.05) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 10% 40%, rgba(91,184,255,0.06) 0%, transparent 65%),
      radial-gradient(ellipse 60% 50% at 90% 60%, rgba(200,127,255,0.06) 0%, transparent 65%);
    animation: pulse 5s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes pulse { from { opacity:0.6; } to { opacity:1; } }

  .stage {
    position:relative; z-index:1;
    width:1920px; height:1080px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:56px 140px;
    gap:0;
  }

  /* ── 헤더 ── */
  .header {
    width:100%;
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom:52px;
    opacity:0;
    animation: fadeUp 0.6s ease 0.15s forwards;
  }

  .h-left .eyebrow {
    font-size:15px; font-weight:300; letter-spacing:0.25em;
    color:rgba(242,240,255,0.3); margin-bottom:10px;
  }
  .h-left h1 {
    font-size:82px; font-weight:900; line-height:1;
    letter-spacing:-0.03em; color:var(--white);
  }
  .h-left h1 .accent {
    color:var(--hybe);
    text-shadow:0 0 30px var(--glow-hybe), 0 0 60px var(--glow-hybe);
  }
  .h-right {
    font-size:19px; font-weight:300;
    color:rgba(242,240,255,0.32);
    text-align:right; line-height:1.8; letter-spacing:0.05em;
  }

  /* ── 다이어그램 ── */
  .diagram {
    width:100%;
    flex:1;
    display:grid;
    grid-template-columns:1fr 220px 1fr;
    align-items:center;
    position:relative;
    gap:0;
  }

  /* SVG 연결선 */
  svg.lines {
    position:absolute; inset:0;
    width:100%; height:100%;
    overflow:visible; pointer-events:none;
  }

  .conn {
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-dasharray:500;
    stroke-dashoffset:500;
    filter:url(#glow);
  }
  .conn.ls  { stroke:var(--ls);  animation: drawLine 0.9s ease 1.2s forwards; }
  .conn.il  { stroke:var(--il);  animation: drawLine 0.9s ease 1.45s forwards; }
  .conn.kat { stroke:var(--kat); animation: drawLine 0.9s ease 1.2s forwards; }

  @keyframes drawLine { to { stroke-dashoffset:0; } }

  /* ── 왼쪽 그룹 ── */
  .left-col {
    display:flex; flex-direction:column; gap:28px;
    align-items:flex-end; padding-right:60px;
  }

  /* ── 오른쪽 그룹 ── */
  .right-col {
    display:flex; flex-direction:column; gap:28px;
    align-items:flex-start; padding-left:60px;
  }

  /* ── 그룹 노드 ── */
  .gnode {
    display:flex; align-items:center; gap:0;
    opacity:0;
  }
  .gnode.ls  { animation: popFromLeft  0.7s cubic-bezier(0.22,1.5,0.36,1) 0.8s  forwards; }
  .gnode.il  { animation: popFromLeft  0.7s cubic-bezier(0.22,1.5,0.36,1) 1.0s  forwards; }
  .gnode.kat { animation: popFromRight 0.7s cubic-bezier(0.22,1.5,0.36,1) 0.8s  forwards; }

  .gbox {
    padding:28px 36px;
    border-radius:14px;
    position:relative; overflow:hidden;
    cursor:default;
  }

  .gnode.ls  .gbox { background:rgba(91,184,255,0.08);  border:1.5px solid rgba(91,184,255,0.35);  box-shadow:0 0 30px rgba(91,184,255,0.12); }
  .gnode.il  .gbox { background:rgba(255,107,138,0.08); border:1.5px solid rgba(255,107,138,0.35); box-shadow:0 0 30px rgba(255,107,138,0.12); }
  .gnode.kat .gbox { background:rgba(200,127,255,0.08); border:1.5px solid rgba(200,127,255,0.35); box-shadow:0 0 30px rgba(200,127,255,0.12); }

  /* 카드 내부 shimmer */
  .gbox::before {
    content:''; position:absolute;
    top:-80%; left:-30%; width:50%; height:100%;
    border-radius:50%; filter:blur(36px); opacity:0.15;
    animation:shimmer 4s ease-in-out infinite alternate;
  }
  .gnode.ls  .gbox::before { background:var(--ls); }
  .gnode.il  .gbox::before { background:var(--il); animation-delay:1.2s; }
  .gnode.kat .gbox::before { background:var(--kat); animation-delay:2.4s; }
  @keyframes shimmer {
    from { transform:translate(-10%,-10%); opacity:0.1; }
    to   { transform:translate(30%, 40%); opacity:0.22; }
  }

  .g-name {
    font-family:'Bebas Neue', sans-serif;
    font-size:34px; letter-spacing:0.1em; line-height:1;
    margin-bottom:8px;
  }
  .gnode.ls  .g-name { color:var(--ls);  text-shadow:0 0 18px var(--glow-ls); }
  .gnode.il  .g-name { color:var(--il);  text-shadow:0 0 18px var(--glow-il); }
  .gnode.kat .g-name { color:var(--kat); text-shadow:0 0 18px var(--glow-kat); }

  .g-role { font-size:19px; font-weight:700; color:var(--white); margin-bottom:6px; }
  .g-tag  { font-size:14px; font-weight:300; color:rgba(242,240,255,0.38); letter-spacing:0.06em; }

  /* ── 중앙 HYBE ── */
  .center-col {
    display:flex; align-items:center; justify-content:center;
    position:relative; z-index:2;
  }

  .hybe-wrap {
    display:flex; flex-direction:column; align-items:center;
    opacity:0;
    animation: popCenter 0.8s cubic-bezier(0.22,1.6,0.36,1) 0.5s forwards;
  }

  @keyframes popCenter {
    from { opacity:0; transform:scale(0.5); }
    to   { opacity:1; transform:scale(1); }
  }

  .hybe-ring {
    width:164px; height:164px;
    border-radius:50%;
    border:2px solid var(--hybe);
    box-shadow:
      0 0 24px var(--glow-hybe),
      0 0 60px rgba(255,217,122,0.2),
      inset 0 0 30px rgba(255,217,122,0.06);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    position:relative;
    background:rgba(255,217,122,0.05);
    animation:ringPulse 2.5s ease-in-out infinite;
  }

  @keyframes ringPulse {
    0%,100% { box-shadow: 0 0 24px var(--glow-hybe), 0 0 60px rgba(255,217,122,0.2), inset 0 0 30px rgba(255,217,122,0.06); }
    50%      { box-shadow: 0 0 40px var(--glow-hybe), 0 0 90px rgba(255,217,122,0.35),inset 0 0 40px rgba(255,217,122,0.1); }
  }

  /* 외곽 회전 점선 */
  .hybe-ring::before {
    content:''; position:absolute;
    inset:-14px; border-radius:50%;
    border:1px dashed rgba(255,217,122,0.22);
    animation:spin 12s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .hybe-txt {
    font-family:'Bebas Neue', sans-serif;
    font-size:38px; letter-spacing:0.18em;
    color:var(--hybe);
    text-shadow:0 0 20px var(--glow-hybe);
    line-height:1;
  }
  .hybe-sub {
    font-size:12px; font-weight:300;
    color:rgba(255,217,122,0.55);
    letter-spacing:0.15em; margin-top:5px;
  }

  /* ── 하단 바 ── */
  .bottom-bar {
    width:100%;
    display:grid; grid-template-columns:1fr 1fr 1fr;
    border-top:1px solid rgba(242,240,255,0.08);
    padding-top:28px; margin-top:40px;
    opacity:0;
    animation:fadeUp 0.7s ease 2.0s forwards;
  }

  .bi { text-align:center; padding:0 20px; }
  .bi + .bi { border-left:1px solid rgba(242,240,255,0.08); }
  .bi .bl { font-size:13px; font-weight:300; letter-spacing:0.18em; color:rgba(242,240,255,0.28); margin-bottom:6px; }
  .bi .bv { font-size:20px; font-weight:700; }
  .bi:nth-child(1) .bv { color:var(--ls);  text-shadow:0 0 12px var(--glow-ls); }
  .bi:nth-child(2) .bv { color:var(--hybe);text-shadow:0 0 12px var(--glow-hybe); }
  .bi:nth-child(3) .bv { color:var(--kat); text-shadow:0 0 12px var(--glow-kat); }

  /* ── 공통 ── */
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(16px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @keyframes popFromLeft {
    from { opacity:0; transform:translateX(-50px) scale(0.9); }
    to   { opacity:1; transform:translateX(0)     scale(1); }
  }
  @keyframes popFromRight {
    from { opacity:0; transform:translateX(50px) scale(0.9); }
    to   { opacity:1; transform:translateX(0)    scale(1); }
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="bg-pulse"></div>

<div class="stage">

  <!-- 헤더 -->
  <div class="header">
    <div class="h-left">
      <p class="eyebrow">HYBE STRATEGY — 그냥 콜라보가 아니에요</p>
      <h1>동시 <span class="accent">공략.</span></h1>
    </div>
    <div class="h-right">
      국내 팬덤 × 신예 × 글로벌<br>
      하나의 곡으로 세 시장을 관통
    </div>
  </div>

  <!-- 다이어그램 -->
  <div class="diagram" id="diag">

    <!-- SVG 연결선 (JS로 그림) -->
    <svg class="lines" id="lineSvg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
    </svg>

    <!-- 왼쪽 -->
    <div class="left-col">
      <div class="gnode ls" id="nLS">
        <div class="gbox">
          <div class="g-name">LE SSERAFIM</div>
          <div class="g-role">국내 핵심 팬덤 수성</div>
          <div class="g-tag">데뷔 3년차 · 검증된 글로벌 IP</div>
        </div>
      </div>
      <div class="gnode il" id="nIL">
        <div class="gbox">
          <div class="g-name">ILLIT</div>
          <div class="g-role">Z세대 신규 유입</div>
          <div class="g-tag">데뷔 1년차 · 바이럴 버블 에너지</div>
        </div>
      </div>
    </div>

    <!-- 중앙 HYBE -->
    <div class="center-col">
      <div class="hybe-wrap" id="nHYBE">
        <div class="hybe-ring">
          <div class="hybe-txt">HYBE</div>
          <div class="hybe-sub">ONE SONG</div>
        </div>
      </div>
    </div>

    <!-- 오른쪽 -->
    <div class="right-col">
      <div class="gnode kat" id="nKAT">
        <div class="gbox">
          <div class="g-name">KATSEYE</div>
          <div class="g-role">글로벌 시장 개척</div>
          <div class="g-tag">LA 베이스 · 처음부터 글로벌 타깃</div>
        </div>
      </div>
    </div>

  </div>

  <!-- 하단 -->
  <div class="bottom-bar">
    <div class="bi"><p class="bl">국내 팬덤 수성</p><p class="bv">LE SSERAFIM + ILLIT</p></div>
    <div class="bi"><p class="bl">전략적 교차점</p><p class="bv">ICONIC BY MISTAKE</p></div>
    <div class="bi"><p class="bl">글로벌 확장</p><p class="bv">KATSEYE</p></div>
  </div>

</div>

<script>
// 파티클
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
canvas.width = 1920; canvas.height = 1080;
const COLORS = ['rgba(91,184,255,','rgba(255,107,138,','rgba(200,127,255,','rgba(255,217,122,'];
const pts = [];
for (let i=0;i<70;i++) pts.push({
  x:Math.random()*1920, y:Math.random()*1080,
  r:Math.random()*1.8+0.3,
  vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.3,
  c:COLORS[Math.floor(Math.random()*4)],
  a:Math.random()*0.45+0.1,
  p:Math.random()*Math.PI*2,
  ps:Math.random()*0.018+0.007
});
(function draw(){
  ctx.clearRect(0,0,1920,1080);
  pts.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.p+=p.ps;
    if(p.x<0)p.x=1920; if(p.x>1920)p.x=0;
    if(p.y<0)p.y=1080; if(p.y>1080)p.y=0;
    const a=p.a*(0.65+0.35*Math.sin(p.p));
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*9);
    g.addColorStop(0,p.c+a+')'); g.addColorStop(1,p.c+'0)');
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*9,0,Math.PI*2);
    ctx.fillStyle=g; ctx.fill();
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.c+Math.min(a*2,1)+')'; ctx.fill();
  });
  requestAnimationFrame(draw);
})();

// SVG 연결선 — DOM 좌표 기반
window.addEventListener('load',()=>{
  const svg = document.getElementById('lineSvg');
  const diag = document.getElementById('diag');
  const dr = diag.getBoundingClientRect();

  function ctr(el){
    const r=el.getBoundingClientRect();
    return { x:r.left+r.width/2-dr.left, y:r.top+r.height/2-dr.top };
  }

  const H  = ctr(document.getElementById('nHYBE'));
  const LS = ctr(document.getElementById('nLS').querySelector('.gbox'));
  const IL = ctr(document.getElementById('nIL').querySelector('.gbox'));
  const KT = ctr(document.getElementById('nKAT').querySelector('.gbox'));

  // 곡선 경로로 연결 (cubic bezier)
  function makePath(from, to, cls){
    const mx = (from.x + to.x) / 2;
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    const d = `M${from.x},${from.y} C${mx},${from.y} ${mx},${to.y} ${to.x},${to.y}`;
    path.setAttribute('d', d);
    path.classList.add('conn', cls);
    svg.appendChild(path);
  }

  makePath(LS, H, 'ls');
  makePath(IL, H, 'il');
  makePath(KT, H, 'kat');
});
</script>
</body>
</html>
