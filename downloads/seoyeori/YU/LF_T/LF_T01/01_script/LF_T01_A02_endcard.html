<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>A-02 | 엔드카드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root { --black:#080607; --ls:#5BB8FF; --il:#FF6B8A; --kat:#C87FFF; --white:#F5F1EC; --warm:#FFB877; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:var(--black);
    font-family:'Noto Sans KR', sans-serif; color:var(--white); }

  .stage { position:relative; width:1920px; height:1080px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; }

  /* 따뜻한 배경 글로우 — 은은하게 숨쉼 */
  .glow { position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(ellipse 60% 55% at 50% 42%, rgba(255,184,119,.10) 0%, transparent 62%),
      radial-gradient(ellipse 45% 45% at 22% 80%, rgba(200,127,255,.06) 0%, transparent 60%),
      radial-gradient(ellipse 45% 45% at 82% 20%, rgba(91,184,255,.05) 0%, transparent 60%);
    animation:breathe 5s ease-in-out infinite alternate; }
  @keyframes breathe { from{opacity:.7; transform:scale(1);} to{opacity:1; transform:scale(1.03);} }

  /* 로고 — Field Gate 헤더에 쓰는 실제 로고 마크 적용 */
  .brand { display:flex; align-items:center; gap:24px;
    opacity:0; animation:up 5s ease forwards; }
  .brand-mark { width:96px; height:96px; display:block;
    filter:drop-shadow(0 0 44px rgba(255,184,119,.4)); }
  .brand-name { font-size:76px; font-weight:900; letter-spacing:.1em; }
  @keyframes up {
    0%,6%  { opacity:0; transform:translateY(26px); }
    22%    { opacity:1; transform:translateY(0); }
    100%   { opacity:1; transform:translateY(0); }
  }

  .cta { margin-top:44px; font-size:44px; font-weight:500; letter-spacing:.02em;
    color:rgba(245,241,236,.92); text-align:center;
    opacity:0; animation:up2 5s ease forwards; }
  .cta b { font-weight:900; color:var(--warm); }
  @keyframes up2 {
    0%,18% { opacity:0; transform:translateY(20px); }
    34%    { opacity:1; transform:translateY(0); }
    100%   { opacity:1; transform:translateY(0); }
  }

  .pills { margin-top:40px; display:flex; gap:22px;
    opacity:0; animation:up3 5s ease forwards; }
  .pill { display:flex; align-items:center; gap:14px;
    padding:20px 38px; border-radius:999px; font-size:32px; font-weight:700;
    border:1.5px solid rgba(245,241,236,.22); background:rgba(245,241,236,.04); }
  .pill .dot { width:16px; height:16px; border-radius:50%; }
  .pill.sub .dot { background:var(--il); box-shadow:0 0 16px var(--il); }
  .pill.cmt .dot { background:var(--ls); box-shadow:0 0 16px var(--ls); }
  @keyframes up3 {
    0%,30% { opacity:0; transform:translateY(18px); }
    46%    { opacity:1; transform:translateY(0); }
    100%   { opacity:1; transform:translateY(0); }
  }

  /* 다음 영상 카드 (하단에서 슬라이드) */
  .next { position:absolute; left:80px; bottom:72px;
    display:flex; align-items:center; gap:26px;
    padding:22px 30px 22px 22px; border-radius:22px;
    background:rgba(245,241,236,.06); border:1.5px solid rgba(245,241,236,.16);
    backdrop-filter:blur(6px);
    opacity:0; animation:slideCard 5s cubic-bezier(.16,1,.3,1) forwards; }
  .next-thumb { width:210px; height:118px; border-radius:12px; flex-shrink:0;
    background:linear-gradient(135deg, #1a1420, #241a2e);
    display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue'; font-size:22px; letter-spacing:.12em;
    color:rgba(245,241,236,.5); border:1px solid rgba(245,241,236,.12); }
  .next-meta .k { font-size:20px; letter-spacing:.28em; color:rgba(245,241,236,.4); margin-bottom:8px; }
  .next-meta .t { font-size:34px; font-weight:700; }
  @keyframes slideCard {
    0%,42% { opacity:0; transform:translateY(40px); }
    60%    { opacity:1; transform:translateY(0); }
    100%   { opacity:1; transform:translateY(0); }
  }

  .vignette { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 80% 80% at 50% 45%, transparent 55%, rgba(0,0,0,.5) 100%); }
</style>
</head>
